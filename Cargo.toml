[workspace]
resolver = "3"
members = ["crates/backup", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/SkandarS0/FreshWin"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"