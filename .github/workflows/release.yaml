name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version and determine prerelease status
        id: version
        shell: bash
        run: |
          git fetch origin main

          FULL_TAG=${GITHUB_REF#refs/tags/}
          TAG=${FULL_TAG#v}
          CORE=${TAG%%-*}

          if [[ "$TAG" == *-* ]]; then
            SUFFIX="-${TAG#*-}"
          else
            SUFFIX=""
          fi

          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            PRERELEASE=false
          else
            PRERELEASE=true
            if [[ -z "$SUFFIX" ]]; then
              SUFFIX="-alpha"
            fi
          fi

          VERSION="${CORE}${SUFFIX}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "full_tag=$FULL_TAG" >> "$GITHUB_OUTPUT"

      - name: Build raw commit log
        id: commits
        shell: bash
        run: |
          git fetch --tags --force

          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ steps.version.outputs.full_tag }}$" | head -n1 || true)

          {
            echo "log<<EOF"
            echo "## Commits"
            if [[ -n "$PREV_TAG" ]]; then
              git log "${PREV_TAG}..${{ steps.version.outputs.full_tag }}" --oneline
            else
              git log "${{ steps.version.outputs.full_tag }}" --oneline
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/FreshWin.Cli
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.core }}.0
          -p:FileVersion=${{ steps.version.outputs.core }}.0
          -o publish-output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.commits.outputs.log }}
          files: publish-output/fwin.exe
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
