name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version and determine prerelease status
        id: version
        shell: bash
        run: |
          FULL_TAG=${GITHUB_REF#refs/tags/}
          TAG=${FULL_TAG#v}
          CORE=${TAG%%-*}

          if [[ "$TAG" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Guard against off-main stable tags
        if: steps.version.outputs.prerelease == 'false'
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag $GITHUB_REF looks like a stable release but is not on main. Use a -suffix or tag from main."
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/FreshWin.Cli
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.core }}.0
          -p:FileVersion=${{ steps.version.outputs.core }}.0
          -o publish-output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: publish-output/fwin.exe
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          append_body: false
