name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Install toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked -p fwin

      - name: Zip
        run: |
          $zip = "fwin-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path target/release/fwin.exe -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ env.ZIP }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" ./*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes $flags