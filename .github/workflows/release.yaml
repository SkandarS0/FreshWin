name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  BIN_NAME: fwin

jobs:
  build:
    name: Build
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
          - target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-key: ${{ matrix.target }}

      - name: Verify tag is on main
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $pkg = $metadata.packages | Where-Object { $_.name -eq $env:BIN_NAME }
          if (-not $pkg) {
            throw "Package '$env:BIN_NAME' not found in cargo metadata."
          }
          $expectedTag = "v$($pkg.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expectedTag."
          }

      - name: Build
        run: cargo build --release --locked -p ${{ env.BIN_NAME }} --target ${{ matrix.target }}

      - name: Zip
        run: |
          $target = '${{ matrix.target }}'
          $zip = "${{ env.BIN_NAME }}-$env:GITHUB_REF_NAME-$target.zip"
          Compress-Archive -Path "target/$target/release/${{ env.BIN_NAME }}.exe" -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-zip-${{ matrix.target }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-zip-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          for f in *.zip; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" ./*.zip ./*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes $flags